<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visores de Imágenes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: #0f172a; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        h1 { 
            margin-bottom: 40px; 
            font-weight: 300; 
            letter-spacing: 2px; 
            text-align: center;
        }
        .grid { 
            display: flex; 
            gap: 30px; 
            flex-wrap: wrap; 
            justify-content: center; 
            padding: 20px;
        }
        .card { 
            background: #1e293b; 
            padding: 40px; 
            border-radius: 16px; 
            text-align: center; 
            text-decoration: none; 
            color: white; 
            transition: all 0.3s ease; 
            border: 1px solid #334155; 
            width: 250px; 
        }
        .card:hover { 
            transform: translateY(-10px); 
            background: #2563eb; 
            border-color: #3b82f6; 
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4); 
        }
        .card h2 { 
            margin: 0 0 15px 0; 
            font-weight: 500;
        }
        .card p { 
            color: #cbd5e1; 
            font-size: 14px; 
            line-height: 1.6; 
            margin: 0; 
        }
    </style>
</head>
<body>
    <h1>VISORES INTERACTIVOS</h1>
    <div class="grid">
        <a href="vtour_360/tour.html" class="card">
            <h2>Tour 360º (Krpano)</h2>
            <p>Visor esférico inmersivo completo. Diseñado para fotografías equirectangulares de alta resolución.</p>
        </a>
        <a href="vtour_cilindro/tour.html" class="card">
            <h2>Tour Cilíndrico (Krpano)</h2>
            <p>Galería panorámica. Diseñado para fotografías de barrido tomadas con dispositivos móviles.</p>
        </a>
    </div>
</body>
</html>
